# ===========================================================================
# Square21 Marketing — Nginx reverse proxy (TEMPLATE)
# ===========================================================================
#
# ⚠️  THIS IS A TEMPLATE. Do not copy it over a live config blindly.
#     The VPS hosts several other projects. This file is ADDITIVE ONLY:
#     it declares a new server block for square21marketing.com and touches
#     nothing that already exists.
#
# Pre-flight (read-only, safe to run any time):
#
#   # 1. Where do other projects put their vhosts?
#   ls -la /etc/nginx/sites-enabled/ 2>/dev/null || ls -la /etc/nginx/conf.d/
#
#   # 2. Is square21marketing.com already configured somewhere?
#   nginx -T 2>/dev/null | grep -n "square21marketing.com"
#
#   # 3. What ports are taken? (decide your upstream ports from this)
#   ss -ltnp | grep -E ':(3000|3001|3002|3003)\b'
#
#   # 4. Always back up config before changing anything:
#   tar czf "/root/backups/nginx-backup-$(date +%Y%m%d-%H%M%S).tar.gz" \
#       /etc/nginx
#
# Install (only after the checks above and only if the domain is NOT yet
# configured anywhere else):
#
#   # Put this file in the SAME directory the other projects use
#   # (sites-available vs conf.d — match the existing convention).
#   cp deploy/nginx/square21marketing.com.conf \
#      /etc/nginx/sites-available/square21marketing.com.conf
#   ln -s /etc/nginx/sites-available/square21marketing.com.conf \
#         /etc/nginx/sites-enabled/square21marketing.com.conf
#
#   nginx -t          # MUST pass. If it fails, nothing has changed yet.
#   systemctl reload nginx
#
# TLS is added AFTERWARD with certbot (see DEPLOY.md, phase 2). Do not
# hand-write certificate paths.
# ===========================================================================

# --- Upstreams --------------------------------------------------------------
# Must match: backend/.env PORT  ->  npm run start:prod
#             frontend PM2 args   ->  next start -p 3000
# Verify with: ss -ltnp | grep -E ':(3000|3001)\b'
upstream square21_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream square21_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Include www only if it resolves to this box; otherwise drop it.
    server_name square21marketing.com www.square21marketing.com;

    # Baseline cap for normal page requests. Large admin media uploads get a
    # bigger limit on the /api/ location below, so they never 413.
    client_max_body_size 8m;

    access_log /var/log/nginx/square21.access.log;
    error_log  /var/log/nginx/square21.error.log;

    # --- API (NestJS) -------------------------------------------------------
    # Public URL is https://square21marketing.com/api/...
    # The trailing "/" on proxy_pass strips the /api prefix, so
    #   /api/properties  ->  127.0.0.1:3001/properties
    location /api/ {
        proxy_pass http://square21_api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Required: the API runs with `trust proxy: 1` and keys its rate
        # limiter off the first X-Forwarded-For entry.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Admin media endpoints accept up to 5MB images and 100MB videos.
        client_max_body_size 210m;
        client_body_timeout  300s;
        proxy_connect_timeout 15s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;  # Cloudinary uploads + Groq chatbot latency
    }

    # --- Web app (Next.js) --------------------------------------------------
    location / {
        proxy_pass http://square21_web;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Next.js streams server-rendered responses; buffering adds latency.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # --- Hero / property videos (optional but recommended) ------------------
    # public/ currently holds ~500MB of video, which Next.js serves itself on
    # every request. Letting Nginx serve it straight from disk is cheaper and
    # keeps the release artifact smaller.
    #
    # It is COMMENTED OUT because it assumes the repo lives at
    # /root/square21 — verify the path, then uncomment.
    #
    # location ^~ /videos/ {
    #     alias /root/square21/frontend/public/videos/;
    #     access_log off;
    #     expires 30d;
    #     add_header Cache-Control "public, max-age=2592000, immutable";
    #     try_files $uri =404;
    # }

    # Long-lived caching for the hashed Next.js build assets.
    location /_next/static/ {
        proxy_pass http://square21_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uptime probes: https://square21marketing.com/api/health
    # (returns 200 + {"status":"ok"} when the API and database are healthy)
}

# --- Recommended: redirect www -> apex -------------------------------------
# Serving the site on two hostnames is what caused the "Error Loading
# Properties / Load failed" incident on iOS Safari: the www page called the
# apex API, the API only allowed the apex origin, and the browser discarded
# every response (server-rendered HTML kept working, so it looked like a UI
# bug). It also splits NextAuth sessions and duplicates content for search
# engines. Google OAuth redirect URIs are registered for the apex only.
#
# To canonicalise:
#   1. remove `www.square21marketing.com` from the server_name in the block
#      ABOVE (otherwise this redirect is shadowed — nginx uses the first
#      matching server block for the same listen address),
#   2. uncomment the block below,
#   3. ALSO redirect https, not just http: after certbot runs, add
#      `return 301 https://square21marketing.com$request_uri;` to the TLS
#      server block certbot creates for www (or re-run certbot with both -d
#      flags and let it manage it),
#   4. nginx -t && systemctl reload nginx.
#
server {
    listen 80;
    listen [::]:80;
    server_name www.square21marketing.com;
    return 301 https://square21marketing.com$request_uri;
}
